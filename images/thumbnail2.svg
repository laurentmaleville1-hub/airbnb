<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bedroom background -->
  <rect x="0" y="0" width="200" height="200" fill="#F8F8FF"/>
  
  <!-- Bed frame -->
  <rect x="30" y="100" width="140" height="80" fill="#8B4513" rx="5"/>
  
  <!-- Mattress -->
  <rect x="35" y="105" width="130" height="70" fill="url(#bed)" rx="3"/>
  
  <!-- Pillows -->
  <rect x="40" y="110" width="40" height="25" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="120" y="110" width="40" height="25" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Blanket -->
  <rect x="45" y="135" width="110" height="35" fill="#C8102E" opacity="0.8"/>
  
  <!-- Bedside table -->
  <rect x="20" y="150" width="20" height="30" fill="#D2B48C" rx="2"/>
  <rect x="18" y="145" width="24" height="5" fill="#CD853F" rx="2"/>
  
  <!-- Lamp on table -->
  <rect x="25" y="140" width="3" height="10" fill="#8B4513"/>
  <circle cx="26.5" cy="140" r="3" fill="#FFD700"/>
  
  <!-- Wall art - British flag -->
  <rect x="160" y="20" width="25" height="15" fill="#00247D"/>
  <path d="M160,20 L185,35 M185,20 L160,35" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M160,20 L185,35 M185,20 L160,35" stroke="#C8102E" stroke-width="1"/>
  
  <!-- Curtains -->
  <rect x="10" y="30" width="25" height="80" fill="#C8102E" opacity="0.9"/>
  <rect x="165" y="30" width="25" height="80" fill="#C8102E" opacity="0.9"/>
  
  <!-- Window between curtains -->
  <rect x="40" y="40" width="120" height="60" fill="#ADD8E6" stroke="#87CEEB" stroke-width="1"/>
  <rect x="45" y="45" width="110" height="5" fill="#87CEEB"/>
  <rect x="45" y="60" width="110" height="5" fill="#87CEEB"/>
  <rect x="45" y="75" width="110" height="5" fill="#87CEEB"/>
  <rect x="45" y="90" width="110" height="5" fill="#87CEEB"/>
  
  <!-- Text -->
  <rect x="0" y="180" width="200" height="20" fill="rgba(0,0,0,0.7)"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">
    Chambre double
  </text>
</svg>
