<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Living room background -->
  <rect x="0" y="0" width="200" height="200" fill="#F5F5DC"/>
  
  <!-- Sofa -->
  <rect x="20" y="120" width="100" height="40" fill="#8B4513" rx="5"/>
  <rect x="25" y="110" width="90" height="10" fill="#A0522D" rx="3"/>
  <circle cx="40" cy="160" r="3" fill="#8B4513"/>
  <circle cx="60" cy="160" r="3" fill="#8B4513"/>
  <circle cx="80" cy="160" r="3" fill="#8B4513"/>
  <circle cx="100" cy="160" r="3" fill="#8B4513"/>
  
  <!-- Coffee table -->
  <rect x="120" y="140" width="40" height="20" fill="#D2B48C" rx="2"/>
  <rect x="110" y="130" width="60" height="10" fill="#CD853F" rx="2"/>
  
  <!-- Rug -->
  <ellipse cx="100" cy="150" rx="60" ry="20" fill="#C8102E" opacity="0.7"/>
  
  <!-- Wall decoration - Union Jack -->
  <rect x="140" y="20" width="40" height="25" fill="#00247D"/>
  <path d="M140,20 L180,45 M180,20 L140,45" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M140,20 L180,45 M180,20 L140,45" stroke="#C8102E" stroke-width="1.5"/>
  
  <!-- Window -->
  <rect x="10" y="30" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  <rect x="15" y="35" width="50" height="5" fill="#87CEEB"/>
  <rect x="15" y="50" width="50" height="5" fill="#87CEEB"/>
  <rect x="15" y="65" width="50" height="5" fill="#87CEEB"/>
  <rect x="15" y="80" width="50" height="5" fill="#87CEEB"/>
  
  <!-- Lamp -->
  <rect x="170" y="50" width="5" height="30" fill="#8B4513"/>
  <circle cx="172.5" cy="50" r="5" fill="#FFD700"/>
  <rect x="165" y="45" width="15" height="5" fill="#8B4513"/>
  
  <!-- Text -->
  <rect x="0" y="180" width="200" height="20" fill="rgba(0,0,0,0.7)"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">
    Séjour/Cuisine
  </text>
</svg>
