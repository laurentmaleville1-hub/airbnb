<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CFC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Garden background -->
  <rect x="0" y="0" width="200" height="200" fill="url(#grass)"/>
  
  <!-- Wooden deck -->
  <rect x="50" y="120" width="100" height="80" fill="url(#wood)" stroke="#654321" stroke-width="2"/>
  
  <!-- Table -->
  <rect x="70" y="130" width="60" height="30" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="65" y="125" width="70" height="5" fill="#8B4513" rx="2"/>
  
  <!-- Chairs -->
  <rect x="60" y="160" width="15" height="30" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="55" y="155" width="25" height="5" fill="#8B4513" rx="2"/>
  
  <rect x="125" y="160" width="15" height="30" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="120" y="155" width="25" height="5" fill="#8B4513" rx="2"/>
  
  <!-- Electric barbecue -->
  <rect x="150" y="140" width="30" height="20" fill="#808080" rx="3"/>
  <rect x="155" y="135" width="20" height="5" fill="#696969" rx="2"/>
  <circle cx="170" cy="145" r="2" fill="#FF0000"/>
  <circle cx="175" cy="145" r="2" fill="#FF0000"/>
  
  <!-- Fence -->
  <rect x="0" y="80" width="200" height="10" fill="#8B4513"/>
  <rect x="0" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="20" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="40" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="60" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="80" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="100" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="120" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="140" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="160" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="180" y="80" width="5" height="40" fill="#8B4513"/>
  <rect x="195" y="80" width="5" height="40" fill="#8B4513"/>
  
  <!-- Tree -->
  <circle cx="30" cy="60" r="25" fill="#228B22"/>
  <rect x="20" y="60" width="20" height="40" fill="#8B4513"/>
  
  <!-- Flower bed -->
  <ellipse cx="170" cy="100" rx="20" ry="10" fill="#FF6347"/>
  <ellipse cx="175" cy="95" rx="15" ry="8" fill="#FFD700"/>
  
  <!-- Sun -->
  <circle cx="180" cy="30" r="8" fill="#FFD700"/>
  <rect x="175" y="25" width="10" height="2" fill="#FFD700"/>
  <rect x="175" y="33" width="10" height="2" fill="#FFD700"/>
  <rect x="170" y="28" width="2" height="10" fill="#FFD700"/>
  <rect x="183" y="28" width="2" height="10" fill="#FFD700"/>
  <rect x="172" y="17" width="2" height="10" fill="#FFD700"/>
  <rect x="181" y="17" width="2" height="10" fill="#FFD700"/>
  <rect x="178" y="14" width="10" height="2" fill="#FFD700"/>
  <rect x="178" y="38" width="10" height="2" fill="#FFD700"/>
  
  <!-- Text -->
  <rect x="0" y="180" width="200" height="20" fill="rgba(0,0,0,0.7)"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">
    Espace extérieur
  </text>
</svg>
