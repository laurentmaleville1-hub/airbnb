<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <pattern id="brick" patternUnits="userSpaceOnUse" width="20" height="10">
      <rect width="20" height="10" fill="#D2691E"/>
      <path d="M0,0 L20,0 L20,5 L0,5 Z" fill="#CD853F"/>
    </pattern>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="300" fill="url(#sky)"/>
  
  <!-- House structure -->
  <rect x="100" y="200" width="600" height="300" fill="#F5F5DC" stroke="#D2B48C" stroke-width="2"/>
  
  <!-- Roof -->
  <polygon points="50,200 400,100 750,200" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Windows -->
  <rect x="150" y="220" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  <rect x="250" y="220" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  <rect x="350" y="220" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  <rect x="450" y="220" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  <rect x="550" y="220" width="60" height="80" fill="#ADD8E6" stroke="#87CEEB" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="320" y="350" width="80" height="150" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <circle cx="360" cy="410" r="5" fill="#FFD700"/>
  
  <!-- Garden -->
  <rect x="0" y="400" width="800" height="200" fill="#7CFC00"/>
  
  <!-- Pathway -->
  <path d="M400,500 Q450,450 500,500" stroke="#D2B48C" stroke-width="20" fill="none"/>
  
  <!-- Trees -->
  <circle cx="50" cy="350" r="40" fill="#228B22"/>
  <rect x="30" y="350" width="40" height="80" fill="#8B4513"/>
  
  <circle cx="700" cy="380" r="50" fill="#228B22"/>
  <rect x="680" y="380" width="40" height="100" fill="#8B4513"/>
  
  <!-- British flag accent -->
  <rect x="200" y="150" width="40" height="40" fill="#00247D"/>
  <path d="M200,150 L240,190 M240,150 L200,190" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M200,150 L240,190 M240,150 L200,190" stroke="#C8102E" stroke-width="2"/>
  
  <!-- Text overlay -->
  <rect x="0" y="0" width="800" height="60" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="24" font-family="Arial, sans-serif">
    Le cocon de la Londonnerie
  </text>
  
  <!-- Watermark -->
  <text x="400" y="580" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12" font-family="Arial, sans-serif">
    Appartement cosy avec décor londonien
  </text>
</svg>
