<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bbq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="url(#sky)"/>
  
  <!-- Grass -->
  <rect x="0" y="150" width="200" height="50" fill="#7CFC00"/>
  
  <!-- Barbecue grill -->
  <rect x="50" y="120" width="100" height="30" fill="url(#bbq)" rx="5"/>
  <rect x="55" y="115" width="90" height="5" fill="#555555" rx="2"/>
  
  <!-- Grill grates -->
  <rect x="60" y="125" width="80" height="2" fill="#808080"/>
  <rect x="60" y="130" width="80" height="2" fill="#808080"/>
  <rect x="60" y="135" width="80" height="2" fill="#808080"/>
  <rect x="60" y="140" width="80" height="2" fill="#808080"/>
  
  <!-- Control panel -->
  <rect x="100" y="110" width="20" height="10" fill="#444444" rx="2"/>
  <circle cx="105" cy="115" r="1" fill="#FF0000"/>
  <circle cx="110" cy="115" r="1" fill="#FFD700"/>
  <circle cx="115" cy="115" r="1" fill="#00FF00"/>
  
  <!-- Table -->
  <rect x="30" y="160" width="40" height="20" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="25" y="155" width="50" height="5" fill="#8B4513" rx="2"/>
  
  <!-- Chairs around table -->
  <rect x="20" y="180" width="15" height="15" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="18" y="175" width="20" height="5" fill="#8B4513" rx="2"/>
  
  <rect x="65" y="180" width="15" height="15" fill="#D2B48C" stroke="#8B4513" stroke-width="1"/>
  <rect x="62" y="175" width="20" height="5" fill="#8B4513" rx="2"/>
  
  <!-- Food on table -->
  <circle cx="50" cy="165" r="3" fill="#FFD700"/>
  <circle cx="40" cy="165" r="3" fill="#FFD700"/>
  <circle cx="45" cy="160" r="3" fill="#FFD700"/>
  
  <!-- Grill tools -->
  <rect x="160" y="130" width="5" height="20" fill="#808080" rx="1"/>
  <rect x="155" y="145" width="15" height="3" fill="#808080" rx="1"/>
  
  <!-- Smoke -->
  <ellipse cx="100" cy="100" rx="15" ry="10" fill="#D3D3D3" opacity="0.6"/>
  <ellipse cx="105" cy="90" rx="12" ry="8" fill="#D3D3D3" opacity="0.5"/>
  <ellipse cx="110" cy="80" rx="8" ry="5" fill="#D3D3D3" opacity="0.4"/>
  
  <!-- British flag on wall -->
  <rect x="10" y="20" width="15" height="10" fill="#00247D"/>
  <path d="M10,20 L25,30 M25,20 L10,30" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M10,20 L25,30 M25,20 L10,30" stroke="#C8102E" stroke-width="1"/>
  
  <!-- Text -->
  <rect x="0" y="180" width="200" height="20" fill="rgba(0,0,0,0.7)"/>
  <text x="100" y="195" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">
    Barbecue électrique
  </text>
</svg>
