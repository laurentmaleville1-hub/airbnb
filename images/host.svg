<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="face" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <ellipse cx="50" cy="50" rx="40" ry="45" fill="url(#face)" stroke="#D2B48C" stroke-width="2"/>
  
  <!-- Hair -->
  <path d="M20,30 Q50,10 80,30 Q50,20 20,30" fill="#8B4513"/>
  <path d="M25,35 Q50,25 75,35 Q50,30 25,35" fill="#A0522D"/>
  
  <!-- Eyes -->
  <ellipse cx="40" cy="45" rx="6" ry="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <circle cx="40" cy="45" r="2" fill="#000000"/>
  
  <ellipse cx="60" cy="45" rx="6" ry="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <circle cx="60" cy="45" r="2" fill="#000000"/>
  
  <!-- Eyebrows -->
  <path d="M35,40 Q40,35 45,40" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M55,40 Q60,35 65,40" stroke="#8B4513" stroke-width="2" fill="none"/>
  
  <!-- Nose -->
  <path d="M50,45 L50,55" stroke="#8B4513" stroke-width="2" fill="none"/>
  <ellipse cx="50" cy="55" rx="3" ry="2" fill="#8B4513"/>
  
  <!-- Mouth (smile) -->
  <path d="M45,60 Q50,65 55,60" stroke="#C8102E" stroke-width="2" fill="none"/>
  
  <!-- Ears -->
  <ellipse cx="20" cy="45" rx="8" ry="12" fill="url(#face)" stroke="#D2B48C" stroke-width="1"/>
  <ellipse cx="80" cy="45" rx="8" ry="12" fill="url(#face)" stroke="#D2B48C" stroke-width="1"/>
  
  <!-- Neck and shoulders -->
  <rect x="35" y="85" width="30" height="15" fill="#FFE4B5" stroke="#D2B48C" stroke-width="1"/>
  <ellipse cx="50" cy="100" rx="25" ry="8" fill="#FFE4B5" stroke="#D2B48C" stroke-width="1"/>
  
  <!-- British flag pin -->
  <rect x="70" y="30" width="8" height="5" fill="#00247D"/>
  <path d="M70,30 L78,35 M78,30 L70,35" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M70,30 L78,35 M78,30 L70,35" stroke="#C8102E" stroke-width="0.5"/>
</svg>
